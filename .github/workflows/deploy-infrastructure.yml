name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
  workflow_dispatch:

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=()
          [[ -z "${{ secrets.AZURE_CLIENT_ID }}"        ]] && missing+=("AZURE_CLIENT_ID")
          [[ -z "${{ secrets.AZURE_TENANT_ID }}"        ]] && missing+=("AZURE_TENANT_ID")
          [[ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}"  ]] && missing+=("AZURE_SUBSCRIPTION_ID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          if ! az group exists --name taskmanager-dev | grep -q true; then
            echo "Resource group does not exist. Creating..."
            az group create --name taskmanager-dev --location swedencentral --tags Environment=dev Project=taskmanager
          else
            echo "Resource group already exists. Skipping creation."
          fi

      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group taskmanager-dev \
            --template-file ./infrastructure/main.bicep \
            --parameters ./infrastructure/dev.bicepparam \
            --parameters azureAdAdminLogin="${{ secrets.AZURE_AD_ADMIN_LOGIN }}" \
            --parameters azureAdAdminSid="${{ secrets.AZURE_AD_ADMIN_SID }}" \
            --parameters azureAdTenantId="${{ secrets.AZURE_TENANT_ID }}" \
            --verbose

      - name: Get deployment outputs
        id: outputs
        run: |
          echo "Deployment completed successfully"
