version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanager-sqlserver
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: TaskManager123!
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1
    container_name: taskmanager-adminer
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
    restart: unless-stopped

volumes:
  sqlserver_data: