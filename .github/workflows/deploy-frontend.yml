name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (prod requires manual approval)'
        required: true
        type: choice
        options:
          - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Validate required secrets
        run: |
          missing=()
          [[ -z "${{ secrets.AZURE_CLIENT_ID }}"                 ]] && missing+=("AZURE_CLIENT_ID")
          [[ -z "${{ secrets.AZURE_TENANT_ID }}"                 ]] && missing+=("AZURE_TENANT_ID")
          [[ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}"           ]] && missing+=("AZURE_SUBSCRIPTION_ID")
          [[ -z "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" ]] && missing+=("AZURE_STATIC_WEB_APPS_API_TOKEN")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get API URL from Azure
        id: get-api-url
        run: |
          API_URL=$(az webapp show --name taskmanager-dev-api --resource-group taskmanager-dev --query "defaultHostName" -o tsv)
          echo "api_url=https://$API_URL" >> $GITHUB_OUTPUT

      - name: Build
        run: npm run build
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ steps.get-api-url.outputs.api_url }}
          VITE_ENVIRONMENT: dev

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: './frontend'
          output_location: 'dist'
          skip_app_build: true
