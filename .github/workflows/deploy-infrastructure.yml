name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (prod requires manual approval)'
        required: true
        type: choice
        options:
          - dev

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    environment: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        run: |
          az group create --name taskmanager-dev --location swedencentral --tags Environment=dev Project=taskmanager

      - name: Deploy Bicep template
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          resourceGroupName: taskmanager-dev
          template: ./infrastructure/main.bicep
          parameters: >
            ./infrastructure/dev.bicepparam
            azureAdAdminLogin=${{ secrets.AZURE_AD_ADMIN_LOGIN }}
            azureAdAdminSid=${{ secrets.AZURE_AD_ADMIN_SID }}
            azureAdTenantId=${{ secrets.AZURE_TENANT_ID }}
          failOnStdErr: false

      - name: Get deployment outputs
        id: outputs
        run: |
          echo "Deployment completed successfully"
