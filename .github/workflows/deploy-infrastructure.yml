name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (prod requires manual approval)'
        required: true
        type: choice
        options:
          - dev

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=()
          [[ -z "${{ secrets.AZURE_CLIENT_ID }}"        ]] && missing+=("AZURE_CLIENT_ID")
          [[ -z "${{ secrets.AZURE_TENANT_ID }}"        ]] && missing+=("AZURE_TENANT_ID")
          [[ -z "${{ secrets.AZURE_SUBSCRIPTION_ID }}"  ]] && missing+=("AZURE_SUBSCRIPTION_ID")
          [[ -z "${{ secrets.AZURE_AD_ADMIN_LOGIN }}"   ]] && missing+=("AZURE_AD_ADMIN_LOGIN")
          [[ -z "${{ secrets.AZURE_AD_ADMIN_SID }}"     ]] && missing+=("AZURE_AD_ADMIN_SID")
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          az group create --name taskmanager-dev --location swedencentral --tags Environment=dev Project=taskmanager

      - name: Deploy Bicep template
        uses: azure/arm-deploy@v1
        with:
          scope: resourcegroup
          resourceGroupName: taskmanager-dev
          template: ./infrastructure/main.bicep
          parameters: ./infrastructure/dev.bicepparam azureAdAdminLogin='${{ secrets.AZURE_AD_ADMIN_LOGIN }}' azureAdAdminSid='${{ secrets.AZURE_AD_ADMIN_SID }}' azureAdTenantId='${{ secrets.AZURE_TENANT_ID }}'
          failOnStdErr: false

      - name: Get deployment outputs
        id: outputs
        run: |
          echo "Deployment completed successfully"
